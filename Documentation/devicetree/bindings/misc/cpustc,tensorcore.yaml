%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/cpustc,tensorcore.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: CPUSTC TensorCore accelerator

maintainers:
  - CPUSTC maintainers <cpustcpu@users.noreply.github.com>

description: |
  The CPUSTC TensorCore is a variable-size FP32 GEMM accelerator with an APB
  control interface, local A and B block-RAM buffers, an NHWC window loader,
  optional PReLU and pooling, and a non-coherent 32-bit AXI DMA master. One
  completion interrupt covers the full operation.

properties:
  compatible:
    const: cpustc,tensorcore

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: completion

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <1>;
        #size-cells = <1>;

        tensor@1fe04200 {
            compatible = "cpustc,tensorcore";
            reg = <0x1fe04200 0xc0>;
            interrupts = <3>;
            interrupt-names = "completion";
        };
    };

...
